version: 2
params:
  machine: {type: machine, default: [$first]}
  provider: {type: provider, default: [claude]}
  room_dir:
    type: string
    default: /Users/apple/Desktop/den/switch-hackathon/society-room/room
    label: Society room folder
    description: The room/ folder the Society Room CLI reads and writes (members, byelaws, invoices, records).
resources:
  clerk:
    type: agent
    name: clerk
    display_name: Clerk
    instructions: |
      Run `cd {room_dir}/.. && uv run python -m society_room --room {room_dir} <command>; true` for every number or decision, post its one output line word for word, and never edit files in {room_dir} by hand.
      On "@clerk open a meeting": take the exclusive role meeting-chair, run `meeting open --present <member-id,member-id,...> --chair <sender's Mattermost username>` (ask the chair for the present member ids if not given), then `vote --invoice <id> --motion "<text>" --votes <member-id=aye,member-id=nay,...> --by <sender's Mattermost username>` for each motion.
      When the meeting ends run `meeting close --by <sender's Mattermost username>`, then drop the role meeting-chair; for a message you would refuse, run no command at all.
    provider: "{provider}"
    machine: "{machine}"
    directory: "{$agents_dir}/{clerk.name}"
    addressing: owner   # PER-88: Switch refuses outsiders before the clerk sees them
  treasurer_agent:
    type: agent
    name: treasurer-agent
    display_name: Treasurer Agent
    instructions: |
      Run `cd {room_dir}/.. && uv run python -m society_room --room {room_dir} <command>; true` for every number or decision, post its one output line word for word, and never edit files in {room_dir} by hand.
      When the owner asks to book an expense, run `book <invoice> <resolution>` at once, with `-` when the message names none (never ask first); for the society's position, run `status`.
      Book nothing on your own initiative.
    provider: "{provider}"
    machine: "{machine}"
    directory: "{$agents_dir}/{treasurer_agent.name}"
    addressing: owner   # hour-1 test: does Switch refuse messages from non-owners?
  byelaw:
    type: agent
    name: byelaw
    display_name: Byelaw
    instructions: |
      Run `cd {room_dir}/.. && uv run python -m society_room --room {room_dir} <command>; true` for every number or decision, post its one output line word for word, and never edit files in {room_dir} by hand.
      To judge an invoice against the byelaws, run `check <invoice>` and relay its verdict.
    provider: "{provider}"
    machine: "{machine}"
    directory: "{$agents_dir}/{byelaw.name}"
    addressing: {anyone_in: [committee]}
  concierge:
    type: agent
    name: concierge
    display_name: Concierge
    instructions: |
      Answer residents only by quoting lines of ledger.md, minutes.md, resolutions.jsonl or agenda.md in {room_dir}, naming the file; never edit those files by hand.
      If they do not answer the question, say so and run `cd {room_dir}/.. && uv run python -m society_room --room {room_dir} agenda add "<question>"`, then post its one output line word for word.
    provider: "{provider}"
    machine: "{machine}"
    directory: "{$agents_dir}/{concierge.name}"
    addressing: {anyone_in: [general_body]}
  committee:
    type: room
    name: committee
    description: Society committee (private)
    channel_type: channel_private
    agents: [clerk, treasurer_agent, byelaw]
    instructions: Clerk takes the exclusive role meeting-chair when the Chairman opens a meeting.
    kickoff: |
      @{clerk.name} define an exclusive role meeting-chair: only its holder chairs a meeting, opens and closes it, and records votes. Hold it only from "open a meeting" until the meeting is closed.
    group: society
  general_body:
    type: room
    name: general-body
    description: Residents (read-only on committee drafts)
    agents: [concierge]
    group: society
  society:
    type: group
    name: Society Room
    description: Committee and general body
    links: [{from: committee, to: general_body, label: published records}]
