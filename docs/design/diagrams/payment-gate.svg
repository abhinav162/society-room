<text x="20" y="565" fill="#666" font-size="12">Beats: 2 = blocked, then REFUSED at check 2. 3 = all checks pass, booked. 4 = INV-400 (Rs 4,00,000) fails check 3 and goes to agenda.md for the AGM.</text>
